<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- Entrada -->
  <rect x="30" y="50" width="170" height="110" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="115" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Candidatas</text>
  <text x="115" y="106" text-anchor="middle" font-size="13" fill="#333333">calidad completa,</text>
  <text x="115" y="124" text-anchor="middle" font-size="13" fill="#333333">alta o media</text>
  <text x="115" y="142" text-anchor="middle" font-size="13" fill="#333333">según CheckV</text>

  <!-- 1. Genes -->
  <rect x="240" y="50" width="170" height="110" rx="10" fill="#2e7d32"/>
  <text x="325" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1. Predice genes</text>
  <text x="325" y="119" text-anchor="middle" font-size="13" fill="#ffffff">y los traduce a</text>
  <text x="325" y="137" text-anchor="middle" font-size="13" fill="#ffffff">proteínas</text>

  <!-- 2. Anotación -->
  <rect x="450" y="50" width="190" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="545" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">2. Anota las proteínas</text>
  <text x="545" y="98" text-anchor="middle" font-size="13" fill="#333333">contra bases de datos:</text>
  <rect x="462" y="112" width="52" height="30" rx="6" fill="#2e7d32"/>
  <text x="488" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">KEGG</text>
  <rect x="520" y="112" width="52" height="30" rx="6" fill="#2e7d32"/>
  <text x="546" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Pfam</text>
  <rect x="578" y="112" width="52" height="30" rx="6" fill="#2e7d32"/>
  <text x="604" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">VOG</text>

  <!-- 3. Modelo -->
  <rect x="680" y="50" width="150" height="110" rx="10" fill="#3f72a8"/>
  <text x="755" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3. Modelo de</text>
  <text x="755" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">aprendizaje</text>
  <text x="755" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">automático</text>
  <text x="755" y="147" text-anchor="middle" font-size="13" fill="#ffffff">¿es un fago?</text>

  <!-- Flechas fila 1 -->
  <line x1="200" y1="105" x2="237" y2="105" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="410" y1="105" x2="447" y2="105" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="640" y1="105" x2="677" y2="105" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Resultados -->
  <line x1="710" y1="160" x2="650" y2="217" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="800" y1="160" x2="800" y2="217" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="570" y="220" width="150" height="64" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="645" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#444444">No</text>
  <text x="645" y="268" text-anchor="middle" font-size="13" fill="#444444">se descarta</text>
  <rect x="740" y="220" width="110" height="64" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="795" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">Sí</text>
  <text x="795" y="268" text-anchor="middle" font-size="13" fill="#1b5e20">es un fago</text>

  <!-- Lítico / lisogénico -->
  <line x1="780" y1="284" x2="727" y2="313" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="810" y1="284" x2="812" y2="313" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="684" y="316" width="76" height="30" rx="6" fill="#3f72a8"/>
  <text x="722" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">lítico</text>
  <rect x="770" y="316" width="84" height="30" rx="6" fill="#b8620f"/>
  <text x="812" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">lisogénico</text>

  <text x="30" y="380" font-size="12" fill="#757575">VIBRANT también busca genes auxiliares del metabolismo (AMGs); los revisamos en el paso 28.</text>
</svg>
