<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 335" width="860" height="335" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="335" fill="#ffffff"/>

  <!-- Genoma real -->
  <text x="40" y="40" font-size="15" font-weight="bold" fill="#222222">Genoma viral real: 40 kb</text>
  <rect x="40" y="52" width="800" height="34" rx="6" fill="#eef5ee" stroke="#2e7d32" stroke-width="2"/>
  <!-- genes tramo 1 -->
  <rect x="52" y="58" width="70" height="22" rx="3" fill="#9ccc65"/>
  <rect x="130" y="58" width="60" height="22" rx="3" fill="#2e7d32"/>
  <rect x="198" y="58" width="34" height="22" rx="3" fill="#9ccc65"/>
  <!-- tramo 2 -->
  <rect x="252" y="58" width="80" height="22" rx="3" fill="#9ccc65"/>
  <rect x="340" y="58" width="50" height="22" rx="3" fill="#9ccc65"/>
  <rect x="398" y="58" width="34" height="22" rx="3" fill="#9ccc65"/>
  <!-- tramo 3 -->
  <rect x="452" y="58" width="50" height="22" rx="3" fill="#9ccc65"/>
  <rect x="510" y="58" width="100" height="22" rx="3" fill="#2e7d32"/>
  <rect x="618" y="58" width="16" height="22" rx="3" fill="#9ccc65"/>
  <!-- tramo 4 -->
  <rect x="652" y="58" width="60" height="22" rx="3" fill="#9ccc65"/>
  <rect x="722" y="58" width="70" height="22" rx="3" fill="#9ccc65"/>
  <rect x="800" y="58" width="32" height="22" rx="3" fill="#9ccc65"/>

  <!-- Cortes -->
  <line x1="240" y1="92" x2="240" y2="150" stroke="#b71c1c" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="440" y1="92" x2="440" y2="150" stroke="#b71c1c" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="640" y1="92" x2="640" y2="150" stroke="#b71c1c" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Ensamble -->
  <rect x="36" y="122" width="214" height="20" fill="#ffffff"/>
  <text x="40" y="136" font-size="15" font-weight="bold" fill="#222222">Ensamble: 4 contigs de 10 kb</text>
  <!-- contig 1 -->
  <rect x="44" y="152" width="192" height="34" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <rect x="52" y="158" width="70" height="22" rx="3" fill="#9ccc65"/>
  <rect x="130" y="158" width="60" height="22" rx="3" fill="#2e7d32"/>
  <rect x="198" y="158" width="34" height="22" rx="3" fill="#9ccc65"/>
  <!-- contig 2 -->
  <rect x="244" y="152" width="192" height="34" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <rect x="252" y="158" width="80" height="22" rx="3" fill="#9ccc65"/>
  <rect x="340" y="158" width="50" height="22" rx="3" fill="#9ccc65"/>
  <rect x="398" y="158" width="34" height="22" rx="3" fill="#9ccc65"/>
  <!-- contig 3 -->
  <rect x="444" y="152" width="192" height="34" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <rect x="452" y="158" width="50" height="22" rx="3" fill="#9ccc65"/>
  <rect x="510" y="158" width="100" height="22" rx="3" fill="#2e7d32"/>
  <rect x="618" y="158" width="16" height="22" rx="3" fill="#9ccc65"/>
  <!-- contig 4 -->
  <rect x="644" y="152" width="192" height="34" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <rect x="652" y="158" width="60" height="22" rx="3" fill="#9ccc65"/>
  <rect x="722" y="158" width="70" height="22" rx="3" fill="#9ccc65"/>
  <rect x="800" y="158" width="32" height="22" rx="3" fill="#9ccc65"/>

  <!-- Etiquetas de contigs -->
  <text x="140" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Contig 1</text>
  <text x="140" y="228" text-anchor="middle" font-size="13" fill="#2e7d32">con gen hallmark</text>
  <text x="340" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Contig 2</text>
  <text x="340" y="228" text-anchor="middle" font-size="13" fill="#757575">sin genes hallmark</text>
  <text x="540" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Contig 3</text>
  <text x="540" y="228" text-anchor="middle" font-size="13" fill="#2e7d32">con gen hallmark</text>
  <text x="740" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Contig 4</text>
  <text x="740" y="228" text-anchor="middle" font-size="13" fill="#757575">sin genes hallmark</text>

  <!-- Leyenda -->
  <rect x="40" y="262" width="18" height="14" rx="3" fill="#2e7d32"/>
  <text x="66" y="274" font-size="13" fill="#333333">gen hallmark (por ejemplo, de la cápside o la terminasa)</text>
  <rect x="460" y="262" width="18" height="14" rx="3" fill="#9ccc65"/>
  <text x="486" y="274" font-size="13" fill="#333333">otros genes</text>
  <text x="40" y="316" font-size="12" fill="#757575">Esquema ilustrativo, no a escala real.</text>
</svg>
