<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect width="860" height="450" fill="#ffffff"/>

  <!-- vOTU y genes -->
  <text x="40" y="38" font-size="15" font-weight="bold" fill="#222222">Un vOTU con sus genes predichos</text>
  <rect x="40" y="50" width="780" height="44" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <rect x="52" y="58" width="84" height="28" rx="4" fill="#3f72a8"/>
  <rect x="148" y="58" width="84" height="28" rx="4" fill="#3f72a8"/>
  <rect x="244" y="58" width="84" height="28" rx="4" fill="#bdbdbd"/>
  <rect x="340" y="58" width="84" height="28" rx="4" fill="#3f72a8"/>
  <rect x="436" y="58" width="84" height="28" rx="4" fill="#3f72a8"/>
  <rect x="532" y="58" width="84" height="28" rx="4" fill="#3f72a8"/>
  <rect x="628" y="58" width="84" height="28" rx="4" fill="#bdbdbd"/>
  <rect x="724" y="58" width="84" height="28" rx="4" fill="#3f72a8"/>

  <!-- Marcadores -->
  <text x="94" y="114" text-anchor="middle" font-size="11" fill="#3f72a8">Caudoviricetes</text>
  <text x="190" y="114" text-anchor="middle" font-size="11" fill="#3f72a8">Caudoviricetes</text>
  <text x="286" y="114" text-anchor="middle" font-size="11" font-style="italic" fill="#757575">sin marcador</text>
  <text x="382" y="114" text-anchor="middle" font-size="11" fill="#3f72a8">Caudoviricetes</text>
  <text x="478" y="114" text-anchor="middle" font-size="11" fill="#3f72a8">Caudoviricetes</text>
  <text x="574" y="114" text-anchor="middle" font-size="11" fill="#3f72a8">Caudoviricetes</text>
  <text x="670" y="114" text-anchor="middle" font-size="11" font-style="italic" fill="#757575">sin marcador</text>
  <text x="766" y="114" text-anchor="middle" font-size="11" fill="#3f72a8">Caudoviricetes</text>

  <text x="40" y="142" font-size="13" fill="#333333">Cada gen se busca entre marcadores virales con taxonomía conocida.</text>

  <!-- Combinar -->
  <line x1="430" y1="152" x2="430" y2="178" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="230" y="182" width="400" height="40" rx="8" fill="#6d4c91"/>
  <text x="430" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Se combina la información de todos los genes</text>
  <line x1="430" y1="222" x2="430" y2="248" stroke="#555555" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- Tarjetas de salida -->
  <rect x="40" y="252" width="240" height="124" rx="10" fill="#f3eef8" stroke="#6d4c91" stroke-width="1.5"/>
  <text x="160" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f6b">n_genes_with_taxonomy</text>
  <text x="160" y="298" text-anchor="middle" font-size="12" fill="#333333">cuántos genes respaldan</text>
  <text x="160" y="314" text-anchor="middle" font-size="12" fill="#333333">la asignación</text>
  <text x="160" y="355" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a2f6b">6</text>

  <rect x="310" y="252" width="240" height="124" rx="10" fill="#f3eef8" stroke="#6d4c91" stroke-width="1.5"/>
  <text x="430" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f6b">agreement</text>
  <text x="430" y="298" text-anchor="middle" font-size="12" fill="#333333">qué tan consistentes son las</text>
  <text x="430" y="314" text-anchor="middle" font-size="12" fill="#333333">asignaciones entre genes</text>
  <text x="430" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a2f6b">1.0 = todos coinciden</text>

  <rect x="580" y="252" width="240" height="124" rx="10" fill="#f3eef8" stroke="#6d4c91" stroke-width="1.5"/>
  <text x="700" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2f6b">lineage</text>
  <text x="700" y="298" text-anchor="middle" font-size="12" fill="#333333">taxonomía asignada</text>
  <text x="700" y="314" text-anchor="middle" font-size="12" fill="#333333">(sigue el ICTV)</text>
  <text x="700" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a2f6b">… Caudoviricetes</text>

  <text x="40" y="432" font-size="12" fill="#757575">Esquema ilustrativo: el número de genes es un ejemplo.</text>
</svg>
