<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="860" height="510" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="510" fill="#ffffff"/>

  <text x="40" y="34" font-size="16" font-weight="bold" fill="#222222">Criterio MIUViG para agrupar secuencias en un mismo vOTU</text>
  <text x="40" y="56" font-size="14" fill="#333333">≥ 95 % de identidad sobre ≥ 85 % de la longitud de la secuencia más corta</text>

  <!-- Caso 1: se agrupan -->
  <text x="40" y="104" font-size="14" font-weight="bold" fill="#222222">A</text>
  <rect x="70" y="90" width="440" height="22" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <text x="40" y="138" font-size="14" font-weight="bold" fill="#222222">B</text>
  <rect x="70" y="124" width="400" height="22" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <rect x="80" y="84" width="368" height="68" rx="4" fill="#4a7fb5" fill-opacity="0.25" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="70" y="172" font-size="13" fill="#333333">identidad 96 % · cubre el 92 % de B</text>
  <circle cx="574" cy="112" r="12" fill="#2e7d32"/>
  <path d="M567,112 L572,117 L581,106" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="596" y="118" font-size="18" font-weight="bold" fill="#2e7d32">Misma vOTU</text>
  <text x="560" y="144" font-size="13" fill="#333333">A (la más larga) es el representante</text>
  <line x1="40" y1="190" x2="820" y2="190" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Caso 2: poca cobertura -->
  <text x="40" y="234" font-size="14" font-weight="bold" fill="#222222">A</text>
  <rect x="70" y="220" width="440" height="22" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <text x="40" y="268" font-size="14" font-weight="bold" fill="#222222">B</text>
  <rect x="70" y="254" width="400" height="22" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <rect x="200" y="214" width="160" height="68" rx="4" fill="#4a7fb5" fill-opacity="0.25" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="70" y="302" font-size="13" fill="#333333">identidad 99 % · cubre sólo el 40 % de B</text>
  <circle cx="574" cy="242" r="12" fill="#b71c1c"/>
  <path d="M568,236 L580,248 M580,236 L568,248" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="248" font-size="18" font-weight="bold" fill="#b71c1c">vOTUs distintas</text>
  <text x="560" y="274" font-size="13" fill="#333333">alta identidad, pero cubre poco</text>
  <line x1="40" y1="320" x2="820" y2="320" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Caso 3: poca identidad -->
  <text x="40" y="364" font-size="14" font-weight="bold" fill="#222222">A</text>
  <rect x="70" y="350" width="440" height="22" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <text x="40" y="398" font-size="14" font-weight="bold" fill="#222222">B</text>
  <rect x="70" y="384" width="400" height="22" rx="4" fill="#cfd8dc" stroke="#78909c" stroke-width="1.5"/>
  <rect x="70" y="344" width="380" height="68" rx="4" fill="#4a7fb5" fill-opacity="0.25" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="70" y="432" font-size="13" fill="#333333">identidad 90 % · cubre el 95 % de B</text>
  <circle cx="574" cy="372" r="12" fill="#b71c1c"/>
  <path d="M568,366 L580,378 M580,366 L568,378" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="596" y="378" font-size="18" font-weight="bold" fill="#b71c1c">vOTUs distintas</text>
  <text x="560" y="404" font-size="13" fill="#333333">cubre mucho, pero la identidad es baja</text>

  <!-- Nota -->
  <text x="40" y="472" font-size="14" fill="#333333">Dentro de cada grupo, CD-HIT-EST conserva como representante la secuencia más larga.</text>
  <text x="40" y="494" font-size="12" fill="#757575">Esquema ilustrativo: los porcentajes son ejemplos. La región azul es el alineamiento.</text>
</svg>
